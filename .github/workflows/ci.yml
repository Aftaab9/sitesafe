name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (matching, tracking, zones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy
      - run: python -m pytest -q

  web:
    name: Web type-check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Each model file must stay under 100 MB
        run: |
          find dist -type f \( -name '*.onnx' -o -name '*.wasm' \) -size +100M | tee big.txt
          test ! -s big.txt
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
