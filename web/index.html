<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SiteSafe checks PPE compliance on site photos, clips and live camera, entirely on your device. Faces are blurred and nothing is uploaded." />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SiteSafe: PPE compliance with privacy</title>
    <script>
      // apply the saved theme before first paint
      try { if (localStorage.getItem('sitesafe-theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
